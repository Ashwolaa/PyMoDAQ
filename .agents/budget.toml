# Edited by a human. Daily caps are a ceiling for one day of the wheel; the plan quota itself is guarded per step by
# runner/cost.py (measured cost vs STOP_AT / WEEK_MAX in runner/cycle.sh).
# The reset window of your Claude plan cannot be read from a session: copy it from claude.ai/settings/usage.

[daily]
cocoordinators = 1
specialist_runs = 10       # owner 2026-11-19: about one day of the wheel (was 14 for the docs reworks)
prs_opened = 6             # owner 2026-11-19: about one day of the wheel (was 10)
runs = 20                  # owner 2026-11-19: about one day of the wheel (was 999 during exploration)
reviews = 10               # pr-reviewer launches per day; owner 2026-11-19 (was 14)
rd_share = 0.2            # fraction of the budget reserved for /optimize-research

[grill]
max_open = 2              # owner 2026-11-22: at most this many open questions for the owner at once

[plan]
reset_time_utc = "00:00"  # (assumed) replace with your real reset time
schedule_after_reset_minutes = 30

[safety]
disable_after_consecutive_failures = 3
disable_if_day_over_budget = true
lower_caps_after_limit_hit = true   # next run uses ceil(cap * 0.7) after an outcome=limit

[pilot]
mode = "run"              # explain | run : switched to run by the owner on 2026-11-19 for the first real run
