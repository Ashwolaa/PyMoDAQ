# Project profile: the only repo-specific file besides budget.toml.
# Fields marked (detected) were read from a file; (assumed) are defaults a human should confirm.

[project]
name = "PyMoDAQ"
fork = "Ashwolaa/PyMoDAQ"              # (detected) git remote origin
upstream = "PyMoDAQ/PyMoDAQ"           # (detected) git remote upstream
base_branch = "dev"                    # (detected) AGENTS.md
mirror_branch = "dev"                  # mirrors upstream/dev, never receives agent commits
integration_branch = "dev_agent"       # (assumed) agent PRs land here
language = "python"                    # (detected)
has_ui = true                          # (assumed) Qt / pyqtgraph

[scopes]
# dependency order (detected: AGENTS.md); a package never imports the ones after it
order = ["pymodaq_utils", "pymodaq_data", "pymodaq_scripting", "pymodaq_gui", "pymodaq"]
root = "packages"
src = "packages/{scope}/src/{scope}"
tests = "packages/{scope}/tests"
# large scopes are planned slice by slice (detected: folder sizes)
slices.pymodaq_gui = ["data", "h5modules", "managers", "parameter", "plotting", "utils"]
slices.pymodaq = ["control_modules", "extensions", "launcher", "utils"]
# scopes with Qt UI code: advisor-uxui and spec-uiux only run on these
ui = ["pymodaq_gui", "pymodaq"]

[checks]
# run from the package directory, as CI does (detected: AGENTS.md)
test = "cd packages/{scope} && pytest"
layering = "pytest packages/pymodaq/tests/layering_test.py"
lint_blocking = "flake8 packages/{scope} --count --select=E9,F63,F7,F82 --show-source --statistics"
# run Qt tests under both: select the binding with PYTEST_QT_API (QT_API alone is ignored by pytest-qt);
# without it pytest-qt picks PySide6. PySide6 stays pinned < 6.12.
qt_backends = ["pyqt6", "pyside6"]
qt_backend_env = "PYTEST_QT_API={backend}"
qt_pins = { pyside6 = "<6.12" }
qt_headless = "QT_QPA_PLATFORM=offscreen"
# a check never hangs an agent: stacks of a test stuck this long (s) are dumped; the whole scope run is killed after test_timeout_s
test_faulthandler_s = 120
test_timeout_s = 1500

# not a blocking check: the existing files are not ruff-formatted, so this fails on almost any touched file.
# Hard rule 5 forbids reformatting untouched code. Agents report it, never fix it, never block on it.
[advisory]
format_check = "ruff format --check {files}"

[limits]
pr_max_changed_lines = 300             # (assumed)
handoff_max_lines = 40
plan_expiry_days = 14

[tools]
# scanners agents may call (installed on demand; missing ones are reported, not faked)
scanners = ["ruff", "vulture", "jscpd", "radon", "mutmut", "coverage", "diff-cover", "import-linter", "pyinstrument"]
repo_tools = ["check_plugin", "check_extension"]
# machine-specific: where the scanners live (system python is externally managed; only `python3` exists)
# Python 3.14 (uv-managed), PyMoDAQ editable from this worktree, scanners, PySide6 + PyQt6
env = "export PATH=$HOME/.venvs/pymodaq-314/bin:$HOME/.npm-global/bin:$PATH"

[specialists]
enabled = ["hygiene", "test-quality", "refactor", "uiux", "docs"]
later = ["api-compat", "perf-threading", "backport"]

[hard_rules]
# from AGENTS.md (detected)
1 = "Never remove or rename a public name used by external plugins without a shim + deprecation_msg; see docs/src/developer_folder/legacy_to_current.rst"
2 = "Never delete or weaken a test without a justification and a coverage diff approved by decider-test-change"
3 = "Never edit generated files directly: README.rst (edit README.rst.tpl), legacy_to_current.rst (run docs/legacy_to_current.py)"
4 = "Push only to your own agent branch"
5 = "Do not reformat files you do not otherwise change"
6 = "Qt only through qtpy; status colours only through StatusPalette; config defaults through pymodaq_utils.config"
7 = "Code must keep passing packages/pymodaq/tests/layering_test.py"
